[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "jarvis-local-assistant"
version = "0.1.0"
description = "Local-first Windows desktop assistant"
readme = "README.md"
requires-python = ">=3.11"
dependencies = ["PyYAML>=6.0.2", "python-dotenv>=1.0.1", "requests>=2.32.0", "numpy>=1.26.0", "sounddevice>=0.5.0", "pyttsx3>=2.98", "mss>=10.0.0", "Pillow>=10.4.0", "keyboard>=0.13.5", "psutil>=6.0.0", "pyautogui>=0.9.54"]

[project.optional-dependencies]
speech = ["faster-whisper>=1.1.0"]
dev = ["pytest>=8.0.0"]

[project.scripts]
jarvis = "jarvis.main:main"

[tool.setuptools.packages.find]
where = ["src"]
